<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Web-App Modus aktivieren -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="StrainHunter" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <title>Strain Hunter</title>
    
    <!-- Eigenes Icon für iOS Home-Bildschirm -->
    <link rel="apple-touch-icon" sizes="180x180" href="/strainhunter/apple-touch-icon.png" />
    
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/strainhunter/favicon.svg" />
    <link rel="icon" type="image/png" href="/strainhunter/favicon.png" />
    
    <!-- PWA Manifest & Android Icons -->
    <link rel="manifest" href="/strainhunter/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/strainhunter/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/strainhunter/icon-512.png" />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              cannabis: {
                50: 'rgb(var(--bg-light) / <alpha-value>)',
                100: 'rgb(var(--brand-500) / 0.1)',
                200: 'rgb(var(--brand-500) / 0.2)',
                300: 'rgb(var(--brand-500) / 0.4)',
                400: 'rgb(var(--brand-500) / 0.6)',
                500: 'rgb(var(--brand-500) / <alpha-value>)',
                600: 'rgb(var(--brand-600) / <alpha-value>)',
                700: 'rgb(var(--brand-600) / 0.8)',
                800: 'rgb(var(--brand-600) / 0.9)',
                900: 'rgb(var(--bg-dark) / 0.8)',
                950: 'rgb(var(--bg-dark) / <alpha-value>)',
              },
              score: {
                good: '#10b981',
              },
              darkbg: '#000000',
              cardbg: '#121212',
            },
            fontFamily: {
              sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            },
            boxShadow: {
              'glow': '0 0 20px -5px rgba(16, 185, 129, 0.3)',
              'card': '0 0 0 1px rgba(0,0,0,0.03), 0 2px 8px rgba(0,0,0,0.04)',
              'card-dark': '0 0 0 1px rgba(255,255,255,0.08), 0 4px 12px rgba(0,0,0,0.5)',
            }
          },
        },
      };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        /* Default Green Theme */
        --brand-500: 16 185 129;  /* Emerald 500 */
        --brand-600: 5 150 105;   /* Emerald 600 */
        --bg-light: 236 253 245;  /* Emerald 50 */
        --bg-dark: 2 44 34;       /* Emerald 950 */
      }

      .theme-pink {
        /* Pink Theme */
        --brand-500: 236 72 153;  /* Pink 500 */
        --brand-600: 219 39 119;  /* Pink 600 */
        --bg-light: 253 242 248;  /* Pink 50 */
        --bg-dark: 64 24 50;
      }
      
      .theme-black {
        /* Black Theme */
        --brand-500: 255 255 255;  
        --brand-600: 200 200 200;  
        --bg-light: 250 250 250;
        --bg-dark: 0 0 0;
      }
      
      .theme-white {
        /* White Theme */
        --brand-500: 0 0 0;  
        --brand-600: 30 30 30;  
        --bg-light: 255 255 255;
        --bg-dark: 250 250 250;
        background-color: #ffffff;
      }

      .theme-blue {
        --brand-500: 59 130 246;  
        --brand-600: 37 99 235;  
        --bg-light: 239 246 255;
        --bg-dark: 23 37 84;
      }

      .theme-red {
        --brand-500: 239 68 68;  
        --brand-600: 220 38 38;  
        --bg-light: 254 242 242;
        --bg-dark: 69 10 10;
      }

      .theme-yellow {
        --brand-500: 234 179 8;  
        --brand-600: 202 138 4;  
        --bg-light: 254 252 232;
        --bg-dark: 66 32 6;
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: rgb(var(--bg-light));
        color: #18181b;
        -webkit-tap-highlight-color: transparent;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overscroll-behavior-y: none; /* Prevents whole page bounce on iOS */
      }

      html.dark body {
        background-color: rgb(var(--bg-dark)); 
        color: #f4f4f5;
      }

      /* Premium Slider Styles */
      input[type=range] {
        -webkit-appearance: none;
        background: transparent;
      }
      input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 20px;
        width: 20px;
        border-radius: 50%;
        background: #ffffff;
        box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        margin-top: -8px;
        cursor: pointer;
        border: 2px solid rgb(var(--brand-500));
      }
      input[type=range]::-moz-range-thumb {
        height: 20px;
        width: 20px;
        border-radius: 50%;
        background: #ffffff;
        border: 2px solid rgb(var(--brand-500));
        cursor: pointer;
        box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      }
      input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 4px;
        cursor: pointer;
        background: rgba(128, 128, 128, 0.2);
        border-radius: 2px;
      }
      html.dark input[type=range]::-webkit-slider-thumb {
        background: #18181b;
        border-color: rgb(var(--brand-500));
        box-shadow: 0 0 10px rgba(var(--brand-500), 0.3);
      }

      /* Custom Scrollbar - Minimal */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(161, 161, 170, 0.4);
        border-radius: 10px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(161, 161, 170, 0.6);
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      html.dark ::-webkit-scrollbar-thumb {
        background: rgba(82, 82, 91, 0.5); 
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      html.dark ::-webkit-scrollbar-thumb:hover {
        background: rgba(82, 82, 91, 0.8);
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      
      .glass {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      html.dark .glass {
        background: rgba(20, 20, 20, 0.7);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      /* iOS Smooth Scroll Fix */
      .ios-scroll {
        -webkit-overflow-scrolling: touch;
      }
    </style>
